name: commit messages

# `edited` as well: a squash merge takes the pull request title as the commit subject
# (`squash_merge_commit_title: COMMIT_OR_PR_TITLE`), and release-please reads that subject to
# decide the version bump — so a title that is not conventional is a release that does not
# happen, however clean the commits under it were. A retitle has to re-run this.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    # Dependabot's subject line is fixed by the tool ("Bump x from 4 to 7") and trips
    # config-conventional's subject-case rule. Its scope is already constrained by the
    # commit-message prefix in dependabot.yml, so there is nothing left here to check.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # install: false because the install below is deliberate, not the default one.
      - uses: pnpm/setup@v2
        with:
          install: false

      # Installed with pnpm, not npm: devDependencies use the `catalog:` protocol, which
      # npm rejects outright ("Unsupported URL Type"). No --frozen-lockfile and no
      # `cache: true` until a lockfile exists — both require one. --ignore-scripts because
      # nothing here needs to build, and lifecycle scripts are the supply-chain surface
      # .claude/rules/dependencies.md exists to keep small.
      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      # The title lint below only means something while the title is what gets merged. That is a
      # repository setting, set by hand and visible to nobody reading the tree, so it is asserted
      # here: squash only, and the squash subject is the pull request title — not the commit
      # message a single-commit pull request would otherwise fall back to.
      - name: Assert the squash merge takes the pull request title
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          settings=$(gh api "repos/${{ github.repository }}" \
            -q '[.allow_merge_commit, .allow_rebase_merge, .allow_squash_merge, .squash_merge_commit_title] | @tsv')
          expected=$(printf 'false\tfalse\ttrue\tPR_TITLE')
          if [ "$settings" != "$expected" ]; then
            echo "::error::merge settings drifted (merge, rebase, squash, squash title): $settings — expected $expected"
            exit 1
          fi

      - name: Lint the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose

      - name: Lint commits in this PR
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
