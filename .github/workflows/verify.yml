name: verify

on:
  pull_request:
  push:
    branches: [main]

# `pnpm install` runs `prepare`, which installs lefthook's git hooks. In CI that means any step
# doing a `git push` runs the whole pre-push suite — the checks this workflow already runs as
# explicit jobs, against a checkout that may not have built yet. Hooks are for a developer's
# machine.
env:
  LEFTHOOK: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two gates that are still standalone scripts, because both are slated for a maintained
  # tool rather than for the suite: `check-prose.mjs` for Vale and `check-a11y.mjs` for axe.
  # Neither imports anything, so this job needs no install and no lockfile.
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # These scripts import nothing, so there is no install — but the runtime still comes from
      # `devEngines.runtime` like every other job, rather than from a second source.
      - uses: pnpm/setup@v2
        with:
          install: false

      - name: Prose
        run: node scripts/check-prose.mjs --check

      - name: Accessibility
        run: node scripts/check-a11y.mjs --check

  # Everything else. Every repository invariant that used to be its own script is a test in the
  # `repo` vitest project now, so `pnpm test` is where they run and the runner owns each verdict:
  # there is no path by which one prints its failure and exits 0.
  code:
    runs-on: ubuntu-latest
    env:
      # One cache directory for every turbo invocation in this job — the environment form of
      # `--cache-dir`, which as a flag could not reach the turbo runs inside `pnpm guardrail`
      # and `pnpm publishable`. The actions/cache step below persists it between runs.
      TURBO_CACHE_DIR: .turbo/cache
      # `--affected` on pull requests only. A push to `main` runs unfiltered, and that is a
      # hard constraint rather than an optimisation left on the table: release.yml refuses to
      # publish unless this workflow passed for the exact commit it is publishing, so the run
      # on `main` has to be a complete one. Filtered there, a release could publish on the
      # strength of a check that skipped most of the repository.
      TURBO_AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      # What `--affected` diffs against. Left to its default, turbo looks for a local `main`,
      # which a pull-request checkout does not have.
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `--affected` needs history back to the merge-base to compute its diff; a depth-1
          # checkout has none, and turbo then treats every package as affected — safe, but a
          # full run on every pull request. Pushes to `main` run unfiltered anyway, so they
          # keep the shallow clone.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      # Persisting the turbo cache across runs is safe because turbo hashes every task's
      # inputs — sources, resolved dependencies, the task definition — into the key it stores
      # under. A restored entry can only replay what running the task would have produced; a
      # stale one is a missed key, never a wrong artifact. The commit SHA makes each run save
      # its own snapshot, and restore-keys let a near miss start from the closest previous
      # run instead of cold.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm typecheck $TURBO_AFFECTED

      # Package suites plus the `repo` project: documentation structure, file references, prose
      # duplication, plan files, rule files, one unit per file, schema depth, junk-drawer
      # filenames, peer dependencies, package metadata, the version stamp and the skills lockfile.
      #
      # Written out rather than `pnpm test`, because the affected filter belongs to the turbo
      # half only: the `repo` project reads the repository as data, so it always runs in full.
      - name: Test
        run: |
          pnpm exec turbo run test $TURBO_AFFECTED
          pnpm exec vitest run --project repo

      # The one place this job builds the applications. `pnpm publishable` below builds only
      # the packages, because publint, attw and the tarball install read nothing else.
      - name: Build
        run: pnpm build $TURBO_AFFECTED

      # The compatibility guardrail, and the reason it is a step of its own rather than a row in
      # `pnpm test`: its verdict depends on the contents of an artifact store, and the whole point
      # of a store is that it holds state a task hash has no reason to see. It is registered as no
      # turbo task, so a green run of it can never be replayed.
      - name: Compatibility guardrail
        run: pnpm guardrail

      - name: Pinned dependencies
        run: pnpm pinned-deps

      - name: Package boundaries
        run: pnpm boundaries

      - name: Duplication
        run: pnpm dupes

      - name: Dead code
        run: pnpm knip

      - name: Type coverage
        run: pnpm type-coverage

      # The gates that read the artifact a consumer would install rather than the source. The
      # tarball install is in its own vitest project because its verdict depends on the registry,
      # which no cache key can see; it is invoked directly and is not a turbo task.
      - name: Publishable
        run: pnpm publishable
